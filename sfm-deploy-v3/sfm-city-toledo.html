  <style>
    :root{--orange:#E85D26;--navy:#0A1628;--white:#ffffff;--off-white:#F8F8F8;--font:'Inter', sans-serif;}

    nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:20px 0;background:var(--navy);box-shadow:0 4px 32px rgba(0,0,0,0.4);transition:padding 0.4s ease;}

    .mobile-menu.open{display:flex;}
    .mobile-menu a{color:var(--white);text-decoration:none;font-size:24px;font-weight:800;}
    .mobile-close{position:absolute;top:20px;right:24px;font-size:32px;cursor:pointer;color:var(--white);background:none;border:none;}
