<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your password | Sales Funnel Marketing</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<style>
:root{--navy:#0A1628;--navy-2:#13213b;--orange:#E85D26;--orange-d:#c44d1e;--ink:#1c2433;--muted:#5f6b7c;--line:#e3e8ef;--bg:#f3f5f8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,var(--navy),var(--navy-2));display:grid;place-items:center;padding:24px 16px;color:var(--ink)}
.card{background:#fff;border-radius:18px;padding:30px 26px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.logo{font-weight:900;letter-spacing:-.3px;font-size:16px;color:var(--navy);text-decoration:none}
.logo b{color:var(--orange)}
h1{margin:14px 0 4px;font-size:23px;letter-spacing:-.4px}
p{margin:0 0 18px;color:var(--muted);font-size:14.5px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted);margin:14px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--orange);outline-offset:1px}
button{font:inherit}
.go{width:100%;margin-top:18px;background:var(--orange);color:#fff;font-weight:800;font-size:16px;padding:13px;border:none;border-radius:10px;cursor:pointer}
.go:hover{background:var(--orange-d)}
.go[disabled]{opacity:.6;cursor:wait}
.err{color:#c53030;font-size:13.5px;font-weight:600;min-height:20px;margin-top:10px}
.small{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.small a{color:var(--orange);font-weight:700}
.test{margin-top:20px;border:1px dashed var(--orange);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
.test b{color:var(--ink)}
.test .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.test button{background:#fff;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;font-size:13px;border-radius:8px;padding:8px 10px;cursor:pointer}
</style>
</head>
<body>
<form class="card" id="f" novalidate>
  <a class="logo" href="/">Sales <b>Funnel</b> Marketing</a>
  <h1>Set your password</h1>
  <p id="who">Checking your link…</p>
  <div id="fields" hidden>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" readonly>
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="10" required>
    <div class="hint">At least 10 characters.</div>
    <label for="pw2">Type it again</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="10" required>
    <button class="go" id="go" type="submit">Save and open my hub</button>
  </div>
  <div class="err" id="err" role="alert"></div>
  <div class="small">Questions? <a href="mailto:jayson@salesfunnelmarketing.us?subject=Client%20Hub%20login">Email Jayson</a>.</div>
</form>
<script>
(function(){
  var t=new URLSearchParams(location.search).get('t')||'';
  var who=document.getElementById('who'),err=document.getElementById('err'),go=document.getElementById('go'),fields=document.getElementById('fields');
  // Keep the one-time token out of the address bar and browser history once it's read.
  if(t && history.replaceState) history.replaceState(null,'',location.pathname);
  if(!t){ who.textContent='This link is missing a piece. Open it straight from your email, or ask Jayson for a new one.'; return; }
  fetch('/api/hub/invite-check?t='+encodeURIComponent(t),{cache:'no-store'})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(x){
      if(!x.ok){ who.textContent=x.j.error||'This link has expired.'; return; }
      who.textContent=x.j.clientName==='SFM team'?'Pick a password for your SFM team login. You\'ll log in with this email from now on.':'Pick a password for your '+x.j.clientName+' Client Hub. You\'ll log in with this email from now on.';
      document.getElementById('email').value=x.j.email;
      fields.hidden=false; document.getElementById('pw').focus();
    })
    .catch(function(){ who.textContent='No connection. Refresh the page to try again.'; });
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault(); err.textContent='';
    var pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
    if(pw.length<10){ err.textContent='Use at least 10 characters.'; return; }
    if(pw!==pw2){ err.textContent='The two passwords don\'t match.'; return; }
    go.disabled=true; go.textContent='Saving…';
    fetch('/api/hub/set-password',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({token:t,password:pw})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(x){ if(x.ok){ location.replace('/client-hub/'); } else { err.textContent=x.j.error||'Something went wrong. Try again.'; go.disabled=false; go.textContent='Save and open my hub'; } })
      .catch(function(){ err.textContent='No connection. Try again in a moment.'; go.disabled=false; go.textContent='Save and open my hub'; });
  });
})();
</script>
</body>
</html>
