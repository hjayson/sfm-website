<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Login | Sales Funnel Marketing</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<style>
:root{--navy:#0A1628;--navy-2:#13213b;--orange:#E85D26;--orange-d:#c44d1e;--ink:#1c2433;--muted:#5f6b7c;--line:#e3e8ef;--bg:#f3f5f8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,var(--navy),var(--navy-2));display:grid;place-items:center;padding:24px 16px;color:var(--ink)}
.card{background:#fff;border-radius:18px;padding:30px 26px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.logo{font-weight:900;letter-spacing:-.3px;font-size:16px;color:var(--navy);text-decoration:none}
.logo b{color:var(--orange)}
h1{margin:14px 0 4px;font-size:23px;letter-spacing:-.4px}
p{margin:0 0 18px;color:var(--muted);font-size:14.5px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted);margin:14px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--orange);outline-offset:1px}
button{font:inherit}
.go{width:100%;margin-top:18px;background:var(--orange);color:#fff;font-weight:800;font-size:16px;padding:13px;border:none;border-radius:10px;cursor:pointer}
.go:hover{background:var(--orange-d)}
.go[disabled]{opacity:.6;cursor:wait}
.err{color:#c53030;font-size:13.5px;font-weight:600;min-height:20px;margin-top:10px}
.small{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.small a{color:var(--orange);font-weight:700}
.test{margin-top:20px;border:1px dashed var(--orange);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
.test b{color:var(--ink)}
.test .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.test button{background:#fff;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;font-size:13px;border-radius:8px;padding:8px 10px;cursor:pointer}
</style>
</head>
<body>
<form class="card" id="f" novalidate>
  <a class="logo" href="/">Sales <b>Funnel</b> Marketing</a>
  <h1>Client Hub</h1>
  <p>Log in to see your progress and this week's numbers.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" required>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button class="go" id="go" type="submit">Log in</button>
  <div class="err" id="err" role="alert"></div>
  <div class="small">Forgot your password? <a href="mailto:jayson@salesfunnelmarketing.us?subject=Client%20Hub%20password">Email Jayson</a> and we'll send a new one.</div>
  <div class="test" id="test" hidden>
    <b>Test copy.</b> Nothing here is a real client. Pick a sample login, then press Log in.
    <div class="row">
      <button type="button" data-u="demo@cleanteam.example">Sample client</button>
      <button type="button" data-u="team@sfm-test.example">SFM team view</button>
    </div>
  </div>
</form>

<!-- Netlify Forms: login alerts are submitted to this form by the server, which emails SFM. -->
<form name="client-login-alert" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="client"><input name="email"><input name="time"><input name="device">
</form>

<script>
(function(){
  var f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
  // Already logged in? Go straight to the hub.
  fetch('/api/hub/me',{credentials:'same-origin'}).then(function(r){ if(r.ok) location.replace('/client-hub/'); return r.json(); }).catch(function(){});
  var host=location.hostname;
  if(host.indexOf('--')>-1 || host==='localhost'){ document.getElementById('test').hidden=false; }
  document.querySelectorAll('[data-u]').forEach(function(b){ b.addEventListener('click',function(){
    document.getElementById('email').value=b.getAttribute('data-u');
    document.getElementById('pw').value='sample-hub-2026';
    go.focus();
  });});
  f.addEventListener('submit',function(e){
    e.preventDefault(); err.textContent='';
    var email=document.getElementById('email').value.trim(), pw=document.getElementById('pw').value;
    if(!email||!pw){ err.textContent='Enter your email and password.'; return; }
    go.disabled=true; go.textContent='Logging in…';
    fetch('/api/hub/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({email:email,password:pw})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(x){ if(x.ok){ location.href='/client-hub/'; } else { err.textContent=x.j.error||'Something went wrong. Try again.'; go.disabled=false; go.textContent='Log in'; } })
      .catch(function(){ err.textContent='No connection. Try again in a moment.'; go.disabled=false; go.textContent='Log in'; });
  });
})();
</script>
</body>
</html>
