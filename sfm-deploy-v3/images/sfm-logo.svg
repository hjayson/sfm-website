<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Navy background circle -->
  <circle cx="40" cy="40" r="39" fill="#0A1628"/>
  <!-- Orange outer ring accent -->
  <circle cx="40" cy="40" r="37" fill="none" stroke="#E85D26" stroke-width="2"/>

  <!-- Globe sphere outline -->
  <circle cx="40" cy="40" r="21" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Vertical meridian curve -->
  <path d="M40 19 C33 28 33 52 40 61" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Equator (main) -->
  <path d="M19 40 C27 34 53 34 61 40" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M19 40 C27 46 53 46 61 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.45"/>

  <!-- Upper latitude -->
  <path d="M23 31 C31 28 49 28 57 31" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Lower latitude -->
  <path d="M23 49 C31 52 49 52 57 49" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Orange diagonal accent slash (the brand signature mark) -->
  <path d="M23 47 C32 41 48 39 57 33" fill="none" stroke="#E85D26" stroke-width="2.5" stroke-linecap="round"/>
</svg>
