name: SFM host redirect verification
on:
  push:
    branches: [seo/sfm-safe-release-2026-10-12]
    paths: [.github/workflows/sfm-host-verification-2026-10-12.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check redirects, page integrity, legacy routing, and previews
        shell: python
        run: |
          import urllib.request,urllib.error,hashlib,json,time
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs
          class Redirects(urllib.request.HTTPRedirectHandler):
              def __init__(self): self.chain=[]
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  self.chain.append({'status':code,'from':req.full_url,'to':newurl})
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          def read(url):
              track=Redirects();opener=urllib.request.build_opener(track)
              req=urllib.request.Request(url,headers={'User-Agent':'SalesFM-Release-Verification/1.0','Cache-Control':'no-cache'})
              try:
                  with opener.open(req,timeout=20) as r:
                      data=r.read()
                      return {'url':url,'final_url':r.url,'status':r.status,'chain':track.chain,'sha256':hashlib.sha256(data).hexdigest()}
              except urllib.error.HTTPError as e:
                  return {'url':url,'final_url':e.url,'status':e.code,'chain':track.chain}
              except Exception as e: return {'url':url,'error':str(e),'chain':track.chain}
          primary='https://www.salesfunnelmarketing.us'
          alias='salesfunnelmarket.netlify.app'
          hashes={
            '/':'9f43d2a9e37379d50633244e812c1e4032d7bac111cfc3a1b567c120118c6974',
            '/sfm-pricing':'79fcb2953c2d07ba0d3e49fa10e46a69b99cc0bd2a44703286e992ecce265743',
            '/sfm-city-perrysburg':'7b2ef71cdf7ae8d69a593ca9281e80ea45e1389091bb9ece5eec79e4de99872d',
            '/sfm-city-toledo':'0c55547e926d54691db931ea0b4df8779b768082811a13286622c402bc3b6724',
            '/sfm-content-creation':'e1a86b2cdbc9dd0bca6198d0031e9314bac3495b8ea25f0b5ba363688e2e5fb3'}
          history=[];passed=False
          for attempt in range(4):
              direct=[read(primary+p) for p in hashes]
              redirected=[read(scheme+'://'+alias+p) for scheme in ['https','http'] for p in ['/','/sfm-city-perrysburg','/sfm-content-creation','/sfm-pricing?utm_source=redirect-test&utm_medium=qa']]
              direct_ok=all(r.get('status')==200 and not r['chain'] and r.get('sha256')==hashes[urlsplit(r['url']).path] for r in direct)
              redirect_ok=True
              for r in redirected:
                  src=urlsplit(r['url']);dst=urlsplit(r.get('final_url',''))
                  valid=(r.get('status')==200 and bool(r['chain']) and all(c['status'] in [301,308] for c in r['chain']) and any(c['status']==301 and urlsplit(c['to']).hostname=='www.salesfunnelmarketing.us' for c in r['chain']) and dst.scheme=='https' and dst.hostname=='www.salesfunnelmarketing.us' and dst.path==src.path and parse_qs(dst.query)==parse_qs(src.query))
                  r['passed']=valid
                  redirect_ok=redirect_ok and valid
              history.append({'attempt':attempt+1,'direct_production_unchanged':direct_ok,'all_host_redirects_passed':redirect_ok})
              if direct_ok and redirect_ok: passed=True;break
              if attempt<3: time.sleep(20)
          legacy=read(primary+'/services')
          missing=read(primary+'/sfm-qa-nonexistent-release-20261012')
          preview=read('https://deploy-preview-9--salesfunnelmarket.netlify.app/')
          safeguards={'legacy_services_redirect_preserved':legacy.get('status')==200 and urlsplit(legacy.get('final_url','')).path=='/sfm-services','missing_page_still_404':missing.get('status')==404,'preview_does_not_redirect_to_production':preview.get('status')==200 and urlsplit(preview.get('final_url','')).hostname=='deploy-preview-9--salesfunnelmarket.netlify.app'}
          result={'redirect_commit':'77a964d58a058e8adca8dfa2b5fce276f6566aff','prior_content_commit':'56401a20243ab53981021549a702100917bc15cf','mode':'read_only_no_forms_submitted','attempts':history,'direct_production':direct,'alternate_host_tests':redirected,'legacy':legacy,'nonexistent':missing,'preview':preview,'safeguards':safeguards,'passed':passed and all(safeguards.values())}
          Path('/tmp/sfm-host-verification.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          assert result['passed'],'Inspect verification report; no automatic writes or rollbacks performed.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfm-host-verification
          path: /tmp/sfm-host-verification.json
          retention-days: 7
