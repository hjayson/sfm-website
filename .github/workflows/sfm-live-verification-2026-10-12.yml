name: SFM read-only live verification
on:
  push:
    branches: [seo/sfm-safe-release-2026-10-12]
    paths: [.github/workflows/sfm-live-verification-2026-10-12.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify production content, crawl signals, and host handling
        shell: python
        run: |
          import hashlib,json,re,time,urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          class Redirects(urllib.request.HTTPRedirectHandler):
              def __init__(self): self.chain=[]
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  self.chain.append({'status':code,'from':req.full_url,'to':newurl})
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          class Page(HTMLParser):
              def __init__(self,s):
                  super().__init__();self.tags=[];self.feed(s)
              def handle_starttag(self,t,a): self.tags.append((t,dict(a)))
          def read(url):
              redirects=Redirects();opener=urllib.request.build_opener(redirects)
              req=urllib.request.Request(url,headers={'User-Agent':'SalesFM-Release-Verification/1.0','Cache-Control':'no-cache'})
              try:
                  with opener.open(req,timeout=25) as r:
                      data=r.read();s=data.decode('utf-8');p=Page(s)
                      return {'requested_url':url,'final_url':r.url,'status':r.status,'redirects':redirects.chain,'canonical':[a.get('href') for t,a in p.tags if t=='link' and a.get('rel')=='canonical'],'robots':[a.get('content') for t,a in p.tags if t=='meta' and a.get('name','').lower()=='robots'],'x_robots_tag':r.headers.get('X-Robots-Tag'),'title':re.findall(r'<title[^>]*>(.*?)</title>',s,re.S|re.I),'h1':re.findall(r'<h1[^>]*>(.*?)</h1>',s,re.S|re.I),'sha256':hashlib.sha256(data).hexdigest()},s,p
              except Exception as e:
                  return {'requested_url':url,'error':str(e),'redirects':redirects.chain},'',None
          result={'release_commit':'56401a20243ab53981021549a702100917bc15cf','mode':'read_only_no_forms_submitted','production':[],'alternate_host':[],'attempts':[]}
          primary='https://www.salesfunnelmarketing.us'
          good=False
          for attempt in range(4):
              home,hs,hp=read(primary+'/');pricing,ps,pp=read(primary+'/sfm-pricing')
              checks={
                  'homepage_200':home.get('status')==200,
                  'pricing_200':pricing.get('status')==200,
                  'content_card_target':bool(hp) and any(t=='a' and a.get('class')=='svc rev-an' and a.get('href')=='/sfm-content-creation' for t,a in hp.tags),
                  'contract_copy':'Managed packages have 6- or 12-month terms, confirmed in your proposal before work begins.' in hs,
                  'faq_terms':'no long-term lock-in pressure' not in hs and 'clearly defined engagement terms' in hs,
                  'portrait_lazy_loading':bool(hp) and all(any(t=='img' and a.get('src')=='/images/'+img and a.get('loading')=='lazy' and a.get('decoding')=='async' for t,a in hp.tags) for img in ['jayson-panel.jpg','jayson-portrait.jpg']),
                  'managed_before_diy':0<=ps.find('<!-- PRICING CARDS -->')<ps.find('<!-- AUTOPILOT BRIDGE -->'),
                  'calendar_copy':'A fixed 30-day content calendar is not a standard deliverable.' in ps,
                  'production_canonicals':all(any(c.startswith(primary) for c in item.get('canonical',[])) for item in [home,pricing]),
                  'no_indexing_block':all('noindex' not in (' '.join(item.get('robots',[]))+' '+str(item.get('x_robots_tag',''))).lower() for item in [home,pricing])
              }
              result['attempts'].append({'number':attempt+1,'checks':checks})
              if all(checks.values()): good=True;break
              if attempt<3: time.sleep(20)
          result['production']=[home,pricing]
          for path in ['/sfm-content-creation','/sfm-city-perrysburg','/sfm-city-toledo']:
              meta,_,_=read(primary+path);result['production'].append(meta)
          for path in ['/','/sfm-city-perrysburg','/sfm-content-creation']:
              meta,_,_=read('https://salesfunnelmarket.netlify.app'+path);result['alternate_host'].append(meta)
          result['release_markers_verified']=good
          result['all_sampled_production_pages_200']=all(p.get('status')==200 for p in result['production'])
          Path('/tmp/sfm-live-verification.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          assert good and result['all_sampled_production_pages_200'],'Live release was not fully verified; inspect report. No automatic configuration changes are made.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfm-live-verification
          path: /tmp/sfm-live-verification.json
          retention-days: 7
